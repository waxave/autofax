[tools]
ruby = "4.0.9"

[tasks.setup]
description = "Install Ruby gem dependencies"
run = "bundle install"

[tasks.test]
description = "Run the complete RSpec suite"
run = "bundle exec rspec"

[tasks."test:cli"]
description = "Run CLI specs"
run = "bundle exec rspec spec/cli_spec.rb"

[tasks.check]
description = "Run Ruby syntax checks and the complete test suite"
run = """
set -eu
ruby -c lib/autofax.rb
ruby -c lib/autofax/client.rb
ruby -c lib/autofax/cache_store.rb
ruby -c lib/autofax/cli.rb
ruby -c exe/autofax
bundle exec rspec
"""

[tasks.build]
description = "Build the autofax gem"
run = "gem build autofax.gemspec"

[tasks.release]
description = "Test, build, tag (vX.Y.Z), and push a release"
run = "./script/release"

[tasks."release:local"]
description = "Test, build, and tag a release locally without pushing"
run = "./script/release --local"

[tasks."release:gem"]
description = "Release and publish the built gem to RubyGems"
run = "./script/release --gem"
